name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            git \
            qt6-base-dev \
            libqt6test6 \
            libprotobuf-dev \
            protobuf-compiler

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-artifact
          path: build/
          include-hidden-files: true

  check-doc-impl-lockstep:
    name: Documentation & Implementation Lockstep Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Static Parity Check
        run: python3 script/check_doc_sync.py --static

      - name: PR Changeset Lockstep Check
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 script/check_doc_sync.py --git-check "origin/${{ github.base_ref }}...HEAD" --commit-msg "$PR_TITLE $PR_BODY"

  test-unit:
    name: Unit Test (${{ matrix.test_name }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - test_PathUtils
          - test_RegMapTreeItem
          - test_RegMapTreeModel
          - test_Serialization
          - test_CodeGenerator
          - test_Formats
          - test_ThemeManager
          - test_LanguageManager
          - test_Version
          - test_ProtobufLogCollector
          - test_RegMapWindow
          - test_RegConfigWindow
          - test_PreferencesWindow
          - test_AboutWindow
          - test_Delegates
          - test_RegBitfieldBarWidget
          - test_BlockMemoryMapWidget
          - test_RegMapTreeView
          - test_Coverage
          - test_SemVer
          - test_Templates
          - test_ArchitecturalInvariants
          - test_DocImplementationSync
          - test_Packaging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qt6-base-dev \
            libqt6test6 \
            libprotobuf-dev \
            protobuf-compiler

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
          path: build/

      - name: Restore Executable Permissions
        run: chmod +x build/bin/* build/tests/backend/* build/tests/frontend/* || true

      - name: Run Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build -R "^${{ matrix.test_name }}$" --output-on-failure

  build-verilator:
    name: Prepare Verilator 5.052
    runs-on: ubuntu-24.04

    steps:
      - name: Cache Verilator 5.052
        id: cache-verilator
        uses: actions/cache@v5
        with:
          path: /home/runner/verilator-5.052
          key: verilator-5.052-${{ runner.os }}

      - name: Install & Compile Verilator 5.052
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git help2man perl python3 make autoconf g++ flex bison ccache \
            libfl2 libfl-dev zlib1g zlib1g-dev liblz4-dev
          git clone --depth 1 --branch v5.052 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/home/runner/verilator-5.052
          make -j$(nproc)
          make install
          rm -rf /tmp/verilator

      - name: Package Verilator
        run: tar -czf /tmp/verilator-5.052.tar.gz -C /home/runner verilator-5.052

      - name: Upload Verilator artifact
        uses: actions/upload-artifact@v5
        with:
          name: verilator-artifact
          path: /tmp/verilator-5.052.tar.gz

  test-templates:
    name: Template Test (${{ matrix.template }})
    needs: [build, build-verilator]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template:
          - c
          - rtl
          - verilog
          - vhdl
          - apb
          - axil
          - sva
          - uvm
          - rust
          - python
          - html
          - markdown
          - asciidoctor
          - systemrdl
          - ipxact
          - svd
          - json
          - rtl_tb
          - pyuvm_tb
          - uvm_tb
          - sim_makefile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Base Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qt6-base-dev \
            libprotobuf-dev \
            protobuf-compiler \
            python3 \
            python3-pip \
            python3-venv \
            jq

      - name: Download Verilator artifact
        if: matrix.template == 'rtl' || matrix.template == 'rtl_tb' || matrix.template == 'verilog' || matrix.template == 'apb' || matrix.template == 'axil' || matrix.template == 'sva'
        uses: actions/download-artifact@v5
        with:
          name: verilator-artifact
          path: /tmp

      - name: Extract Verilator and Add to PATH
        if: matrix.template == 'rtl' || matrix.template == 'rtl_tb' || matrix.template == 'verilog' || matrix.template == 'apb' || matrix.template == 'axil' || matrix.template == 'sva'
        run: |
          tar -xzf /tmp/verilator-5.052.tar.gz -C /home/runner
          echo "/home/runner/verilator-5.052/bin" >> $GITHUB_PATH
          /home/runner/verilator-5.052/bin/verilator --version

      - name: Install Template-Specific Toolchain
        run: |
          case "${{ matrix.template }}" in
            c)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential
              ;;
            rtl|rtl_tb|verilog|apb|axil)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iverilog
              ;;
            vhdl)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ghdl || true
              ;;
            pyuvm_tb)
              python3 -m pip install --break-system-packages cocotb pyuvm || true
              ;;
            rust)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rustc
              ;;
            markdown)
              python3 -m pip install --break-system-packages markdown || true
              ;;
            asciidoctor)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq asciidoctor || true
              ;;
            systemrdl)
              python3 -m pip install --break-system-packages peakrdl peakrdl-systemrdl || true
              ;;
            ipxact|svd)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libxml2-utils
              ;;
            *)
              echo "No additional toolchain required for ${{ matrix.template }}"
              ;;
          esac

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
          path: build/

      - name: Restore Executable Permissions
        run: chmod +x build/bin/* || true

      - name: Run Template Test
        run: QT_QPA_PLATFORM=offscreen python3 tests/test_template.py ${{ matrix.template }}

  coverage:
    name: Code Coverage Analysis
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            qt6-base-dev \
            libqt6test6 \
            libprotobuf-dev \
            protobuf-compiler \
            python3

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
          path: build/

      - name: Restore Executable Permissions
        run: chmod +x build/bin/* build/tests/backend/* build/tests/frontend/* || true

      - name: Run Tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build -L "unit" --output-on-failure

      - name: Generate Multi-Metric Coverage Reports
        run: |
          python3 script/generate_coverage.py \
            --build-dir build \
            --gcov-tool gcov-14 \
            --html work/coverage/index.html \
            --markdown work/coverage/coverage.md \
            --json work/coverage/coverage.json \
            --badges-dir work/coverage \
            --github-step-summary \
            --fail-under-lines 100.0 \
            --fail-under-functions 100.0 \
            --summary

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: work/coverage/

  docs-build:
    name: Build & Render Documentation (Doxygen)
    needs: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Render Documentation Site
        run: |
          doxygen docs/Doxyfile

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: _site/coverage/

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v5
        with:
          name: docs-site
          path: _site/

  docs-deploy:
    name: Deploy Documentation to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download Documentation Artifact
        uses: actions/download-artifact@v5
        with:
          name: docs-site
          path: _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  package-deb:
    name: Package Debian (.deb)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            cmake \
            git \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl-dev \
            libprotobuf-dev \
            protobuf-compiler \
            dpkg-dev

      - name: Configure CMake (Release)
        run: cmake -B build-release -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build rmap
        run: cmake --build build-release -j$(nproc)

      - name: Generate Debian Package (.deb)
        run: cpack --config build-release/CPackConfig.cmake -G DEB -B build-release/packages

      - name: Inspect & Validate Package
        run: |
          ls -lh build-release/packages/*.deb
          dpkg -I build-release/packages/*.deb
          dpkg -c build-release/packages/*.deb

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v5
        with:
          name: rmap-deb
          path: build-release/packages/*.deb

  package-rpm:
    name: Package Enterprise Linux (.rpm)
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing \
            gcc-c++ \
            make \
            cmake \
            git \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            protobuf-devel \
            protobuf-compiler \
            rpm-build \
            file

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure CMake (Release)
        run: cmake -B build-release -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build rmap
        run: cmake --build build-release -j$(nproc)

      - name: Generate RPM Package (.rpm)
        run: cpack --config build-release/CPackConfig.cmake -G RPM -B build-release/packages

      - name: Inspect & Validate Package
        run: |
          ls -lh build-release/packages/*.rpm
          rpm -qip build-release/packages/*.rpm
          rpm -qlp build-release/packages/*.rpm

      - name: Upload RPM Package Artifact
        uses: actions/upload-artifact@v5
        with:
          name: rmap-rpm
          path: build-release/packages/*.rpm

  package-appimage:
    name: Package AppImage (.AppImage)
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing \
            gcc-c++ \
            make \
            cmake \
            git \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            protobuf-devel \
            protobuf-compiler \
            file \
            curl \
            which \
            tar \
            gzip

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure CMake (Release)
        run: cmake -B build-release -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build rmap
        run: cmake --build build-release -j$(nproc)

      - name: Generate AppImage
        run: bash script/build_appimage.sh --build-dir build-release --output-dir build-release/packages

      - name: Inspect & Validate AppImage
        run: |
          ls -lh build-release/packages/*.AppImage
          QT_QPA_PLATFORM=offscreen build-release/packages/*.AppImage --appimage-extract-and-run --version
          QT_QPA_PLATFORM=offscreen build-release/packages/*.AppImage --appimage-extract-and-run --help

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v5
        with:
          name: rmap-appimage
          path: build-release/packages/*.AppImage

