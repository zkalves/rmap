name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            cmake \
            git \
            qt6-base-dev \
            libqt6test6 \
            libprotobuf-dev \
            protobuf-compiler

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-artifact
          path: build/
          include-hidden-files: true

  test-unit:
    name: Unit Test (${{ matrix.test_name }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - test_PathUtils
          - test_RegMapTreeItem
          - test_RegMapTreeModel
          - test_Serialization
          - test_CodeGenerator
          - test_Formats
          - test_ThemeManager
          - test_Version
          - test_RegMapWindow
          - test_RegConfigWindow
          - test_PreferencesWindow
          - test_AboutWindow
          - test_Delegates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qt6-base-dev \
            libqt6test6 \
            libprotobuf-dev \
            protobuf-compiler

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
          path: build/

      - name: Restore Executable Permissions
        run: chmod +x build/bin/* build/tests/backend/* build/tests/frontend/* || true

      - name: Run Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build -R "^${{ matrix.test_name }}$" --output-on-failure

  build-verilator:
    name: Prepare Verilator 5.050
    runs-on: ubuntu-24.04

    steps:
      - name: Cache Verilator 5.050
        id: cache-verilator
        uses: actions/cache@v5
        with:
          path: /home/runner/verilator-5.050
          key: verilator-5.050-${{ runner.os }}

      - name: Install & Compile Verilator 5.050
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git help2man perl python3 make autoconf g++ flex bison ccache \
            libfl2 libfl-dev zlib1g zlib1g-dev liblz4-dev
          git clone --depth 1 --branch v5.050 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/home/runner/verilator-5.050
          make -j$(nproc)
          make install
          rm -rf /tmp/verilator

      - name: Package Verilator
        run: tar -czf /tmp/verilator-5.050.tar.gz -C /home/runner verilator-5.050

      - name: Upload Verilator artifact
        uses: actions/upload-artifact@v5
        with:
          name: verilator-artifact
          path: /tmp/verilator-5.050.tar.gz

  test-templates:
    name: Template Test (${{ matrix.template }})
    needs: [build, build-verilator]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template:
          - c
          - rtl
          - uvm
          - rust
          - python
          - html
          - markdown
          - systemrdl
          - ipxact
          - svd
          - json
          - rtl_tb
          - pyuvm_tb
          - uvm_tb
          - sim_makefile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Base Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qt6-base-dev \
            libprotobuf-dev \
            protobuf-compiler \
            python3 \
            python3-pip \
            python3-venv \
            jq

      - name: Download Verilator artifact
        if: matrix.template == 'rtl' || matrix.template == 'rtl_tb'
        uses: actions/download-artifact@v5
        with:
          name: verilator-artifact
          path: /tmp

      - name: Extract Verilator and Add to PATH
        if: matrix.template == 'rtl' || matrix.template == 'rtl_tb'
        run: |
          tar -xzf /tmp/verilator-5.050.tar.gz -C /home/runner
          echo "/home/runner/verilator-5.050/bin" >> $GITHUB_PATH
          /home/runner/verilator-5.050/bin/verilator --version

      - name: Install Template-Specific Toolchain
        run: |
          case "${{ matrix.template }}" in
            c)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential
              ;;
            rtl|rtl_tb)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iverilog
              ;;
            pyuvm_tb)
              python3 -m pip install --break-system-packages cocotb pyuvm || true
              ;;
            rust)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rustc
              ;;
            markdown)
              python3 -m pip install --break-system-packages markdown || true
              ;;
            systemrdl)
              python3 -m pip install --break-system-packages peakrdl peakrdl-systemrdl || true
              ;;
            ipxact|svd)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libxml2-utils
              ;;
            *)
              echo "No additional toolchain required for ${{ matrix.template }}"
              ;;
          esac

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
          path: build/

      - name: Restore Executable Permissions
        run: chmod +x build/bin/* || true

      - name: Run Template Test
        run: QT_QPA_PLATFORM=offscreen python3 tests/test_template.py ${{ matrix.template }}

  coverage:
    name: Code Coverage Analysis
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            cmake \
            git \
            qt6-base-dev \
            libqt6test6 \
            libprotobuf-dev \
            protobuf-compiler \
            python3

      - name: Configure CMake with Coverage
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON

      - name: Build with Coverage Instrumentation
        run: cmake --build build -j$(nproc)

      - name: Run Tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build -L "unit" --output-on-failure

      - name: Generate Multi-Metric Coverage Reports
        run: |
          python3 script/generate_coverage.py \
            --build-dir build \
            --html work/coverage/index.html \
            --markdown work/coverage/coverage.md \
            --json work/coverage/coverage.json \
            --github-step-summary \
            --summary

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: work/coverage/

  docs-build:
    name: Build & Render Documentation (Pelican)
    needs: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pelican & Markdown
        run: |
          python -m pip install --upgrade pip
          pip install pelican markdown

      - name: Render Documentation Site
        run: |
          pelican docs -s docs/pelicanconf.py -o _site

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: _site/coverage/

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v5
        with:
          name: docs-site
          path: _site/

  docs-deploy:
    name: Deploy Documentation to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download Documentation Artifact
        uses: actions/download-artifact@v5
        with:
          name: docs-site
          path: _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
